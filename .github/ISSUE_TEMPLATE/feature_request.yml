name: Feature request
description: Suggest an improvement for the FORGE portfolio
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        FORGE is a personal portfolio. Requests should improve clarity, accessibility, documentation, or engineering craft — not promote unrelated products.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What gap or friction exists today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: Why it matters
      description: How does this strengthen the professional presentation?
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This request does not ask for private GIA/product source code or proprietary business rules.
          required: true
